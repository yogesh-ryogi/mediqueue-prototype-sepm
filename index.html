<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediQueue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<style>
.home{max-width:760px;margin:0 auto;padding:8vh 20px 40px}
.home h1{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.03em;margin:16px 0 10px}
.home p{color:var(--mute);max-width:48ch}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
.choice{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;color:var(--ink);text-decoration:none}
.choice:hover{border-color:var(--teal)}
.choice b{display:block;font:800 22px "Bricolage Grotesque",sans-serif;margin-bottom:6px}
.choice span{color:var(--mute);font-size:15px}
@media(max-width:600px){.choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="home">
 <div class="logo">Medi<span>Queue</span></div>
 <h1>See a doctor without the waiting room.</h1>
 <p>Prototype of a doctor appointment booking and queue management system. Choose a side to open.</p>
 <div class="choices">
  <a class="choice" href="patient/index.html"><b>Patient website</b><span>Sign up, pick your locality, book a slot and get a token.</span></a>
  <a class="choice" href="doctor/index.html"><b>Doctor dashboard</b><span>Log in to run your queue, slots and walk-ins.</span></a>
 </div>
</main>
</body>
</html>
